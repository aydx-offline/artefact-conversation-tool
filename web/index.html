<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>澄白客户顾问消息工具</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background:#f6f3ee; color:#24211d }
    body { max-width:1100px; margin:auto; padding:24px }
    main { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px }
    section { background:white; border:1px solid #ddd6ca; border-radius:10px; padding:18px }
    label { display:block; margin:8px 0 3px } input,select,textarea,button { font:inherit; box-sizing:border-box }
    input,select,textarea { width:100%; padding:7px; border:1px solid #bdb5a8; border-radius:5px }
    textarea { min-height:70px } button { margin:8px 6px 0 0; padding:7px 12px }
    .candidate,.row { border-top:1px solid #e5dfd5; margin-top:12px; padding-top:12px }
    .flag { color:#9b2c2c; font-weight:600 } pre { white-space:pre-wrap; overflow-wrap:anywhere }
  </style>
</head>
<body>
<h1>澄白客户顾问消息工具</h1>
<main>
  <section id="case-form">
    <h2>案例表单 / Case</h2>
    <form id="case">
      <label>案例编号<input name="case_id" value="web-case"></label>
      <label>客户<select name="client_id"></select></label>
      <label>场景<select name="scenario">
        <option>1 Birthday and festive greetings</option><option>2 Product recommendation</option>
        <option>3 Post-purchase care</option><option>4 Reactivation</option><option>5 Event invitation</option>
        <option>6 Price objection — price too high</option><option>6 Price objection — comparison</option>
        <option>6 Price objection — discount request</option>
      </select></label>
      <label>时间（Asia/Shanghai）<input name="timestamp"></label>
      <label>对话记录（JSON）<textarea name="history">[]</textarea></label>
      <label>产品编号（逗号分隔）<input name="product_ids"></label>
      <label>活动编号<input name="event_id"></label><label>节日或生日<input name="occasion"></label>
      <label>语气偏好<input name="tone" placeholder="留空由模型选择"></label>
      <label>长度偏好<input name="length" placeholder="留空由模型选择"></label>
      <button>确认并生成</button>
    </form>
    <div id="candidates"></div>
  </section>

  <section id="chat">
    <h2>对话演示 / Chat</h2>
    <textarea placeholder="例如：林女士说价格比别处贵，帮我回一下。"></textarea>
    <button>提取到表单</button><p class="status"></p>
  </section>

  <section id="clients">
    <h2>客户 / Clients</h2>
    <select></select><textarea aria-label="客户 JSON"></textarea>
    <button>保存客户</button>
  </section>

  <section id="trace">
    <h2>案例轨迹 / Trace</h2>
    <input placeholder="版本"><input placeholder="运行编号"><input placeholder="案例编号">
    <button>读取轨迹</button><pre></pre>
  </section>

  <section id="batch">
    <h2>批次 / Batch</h2>
    <select><option value="tuning">20 个调优案例</option><option value="final">50 个最终案例</option></select>
    <button data-action="run">运行</button><button data-action="stop">停止</button>
    <p class="error flag"></p>
    <div class="rows"></div>
  </section>

  <section id="versions">
    <h2>版本 / Versions</h2>
    <p>选择两个运行，并排查看同一案例。</p>
    <select class="left"></select><select class="right"></select><input class="case-id" placeholder="案例编号">
    <button>比较案例</button><div class="runs"></div><pre class="comparison"></pre>
  </section>
</main>
<script>
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
async function api(path, options={}) {
  if (options.body && typeof options.body !== "string") options.body=JSON.stringify(options.body);
  const response=await fetch(path,{...options,headers:{...options.headers,"Content-Type":"application/json"}});
  const data=await response.json(); if(!response.ok) throw Error(data.error||"请求失败"); return data;
}
function node(tag,text,className){const value=document.createElement(tag); if(text!=null)value.textContent=text; if(className)value.className=className; return value}
function shanghaiNow(){
  const parts=Object.fromEntries(new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`;
}
const form=$("#case"); form.timestamp.value=shanghaiNow(); let lastResult=null;
function formData(){
  const data=Object.fromEntries(new FormData(form));
  data.history=JSON.parse(data.history||"[]"); data.product_ids=data.product_ids.split(",").map(x=>x.trim()).filter(Boolean); return data;
}
function fillForm(data){for(const [key,value] of Object.entries(data)){const field=form.elements[key]; if(!field)continue; if(key==="history"){field.value=JSON.stringify(value||[],null,2); continue} const scalar=value==null?"":value; field.value=Array.isArray(value)?value.join(","):["string","number"].includes(typeof scalar)?scalar:""}}
function cards(result){
  lastResult=result; const items=result.candidates.map((c,i)=>{
    const article=node("article",null,"candidate"), text=node("textarea"), edit=node("button","编辑"), copy=node("button","复制");
    const checks=result.checks.filter(x=>!x.indexes?.length||x.indexes.includes(i)).map(x=>`${x.passed?"通过":"未通过"}：${x.name}`).join("；");
    text.value=c.text; edit.onclick=()=>text.focus(); copy.onclick=async()=>{const value=text.value; await navigator.clipboard.writeText(value); await api("/api/feedback",{method:"POST",body:{run_id:result.run_id,case_id:result.case_id,client_id:form.client_id.value,candidate:i,strategy:c.strategy,tone:c.tone,original_text:c.text,copied_text:value,edited:value!==c.text,action:"copy",time:shanghaiNow()}})};
    article.append(node("b",`${i+1}. ${c.strategy}`),node("p",`${c.reason} · ${c.tone} · ${c.length}`),text,node("small",`检查：${checks}`),node("br"),edit,copy); return article
  }); $("#candidates").replaceChildren(...items);
}
form.onsubmit=async e=>{e.preventDefault(); try{cards(await api("/api/generate",{method:"POST",body:formData()}))}catch(error){alert(error.message)}};
$("#chat button").onclick=async()=>{try{const result=await api("/api/chat",{method:"POST",body:{request:$("#chat textarea").value}}); fillForm(result.case); $("#chat .status").textContent="请检查表单，再确认生成。"}catch(error){$("#chat .status").textContent=error.message}};
let clientData={};
function clientOptions(select){select.replaceChildren(...Object.values(clientData).map(c=>{const option=node("option",c.name); option.value=c.id; return option}))}
async function loadClients(){const data=await api("/api/clients"); clientData=data.clients; clientOptions(form.client_id); clientOptions($("#clients select")); showClient()}
function showClient(){const id=$("#clients select").value; $("#clients textarea").value=JSON.stringify(clientData[id]||{},null,2)}
$("#clients select").onchange=showClient; $("#clients button").onclick=async()=>{const c=JSON.parse($("#clients textarea").value); await api(`/api/clients/${encodeURIComponent(c.id)}`,{method:"PUT",body:c}); await loadClients()};
$("#trace button").onclick=async()=>{const values=$$("#trace input").map(x=>encodeURIComponent(x.value)); try{$("#trace pre").textContent=JSON.stringify(await api(`/api/runs/${values[0]}/${values[1]}/cases/${values[2]}`),null,2)}catch(error){$("#trace pre").textContent=error.message}};
async function batchRows(){const data=await api("/api/batch"); $("#batch .error").textContent=data.error||""; $("#batch .rows").replaceChildren(...data.rows.map(r=>node("div",`${r.case_id}：${r.status}`,"row"))); if(data.running)setTimeout(batchRows,700)}
$("#batch [data-action=run]").onclick=async()=>{try{await api("/api/batch",{method:"POST",body:{split:$("#batch select").value}}); batchRows()}catch(error){alert(error.message)}};
$("#batch [data-action=stop]").onclick=()=>api("/api/batch/stop",{method:"POST",body:{}}).catch(error=>alert(error.message));
let versionRuns=[];
function runOptions(select){select.replaceChildren(...versionRuns.map((r,i)=>{const option=node("option",`${r.version} · ${r.run_id}`); option.value=i; return option}))}
async function versions(){const data=await api("/api/runs"); versionRuns=data.versions.flatMap(v=>v.runs); const flagged=new Set(data.comparisons.filter(x=>x.flags.length).flatMap(x=>[x.left,x.right])), contents=[]; for(const group of data.versions){contents.push(node("h3",group.version)); for(const run of group.runs){const row=node("div",run.run_id,"row"); if(flagged.has(run.run_id))row.append(" ",node("span","客户库或测试集不同","flag")); contents.push(row)}} $("#versions .runs").replaceChildren(...contents); runOptions($("#versions .left")); runOptions($("#versions .right"))}
$("#versions button").onclick=async()=>{const caseId=encodeURIComponent($("#versions .case-id").value),left=versionRuns[+$("#versions .left").value],right=versionRuns[+$("#versions .right").value]; if(!left||!right)return; try{const pair=await Promise.all([left,right].map(r=>api(`/api/runs/${encodeURIComponent(r.version)}/${encodeURIComponent(r.run_id)}/cases/${caseId}`))); $("#versions .comparison").textContent=pair.map((x,i)=>`${i?"右":"左"}：\n${JSON.stringify(x.candidates,null,2)}`).join("\n\n")}catch(error){$("#versions .comparison").textContent=error.message}};
loadClients().catch(()=>{}); versions().catch(()=>{});
</script>
</body>
</html>
